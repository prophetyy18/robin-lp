[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "robinhood-lp"
version = "0.0.0"
description = "Research, paper-trading, and mainnet execution framework for Uniswap V4 LP strategies on Robinhood Chain."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Robinhood LP" }]
keywords = ["uniswap", "v4", "liquidity", "market-making", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Runtime dependencies are intentionally minimal at T020. They are added by
# later tasks (pyarrow in T031, ...).
dependencies = [
  "pydantic>=2.8,<3",
  # keccak256 for canonical PoolId derivation. The pycryptodome backend
  # is small, pure-Python-importable, and matches the Ethereum spec.
  "eth-hash[pycryptodome]>=0.7",
  # Async HTTP client for the default JSON-RPC transport. Optional at
  # import time; tests inject a fake transport.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
robinhood-lp = "robinhood_lp.__main__:main"

[project.urls]
"Source" = "https://github.com/melodydeck04/robinhood-lp"

# ---------------------------------------------------------------------------
# Hatchling build target
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/robinhood_lp"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
  "--tb=short",
]
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = [
  "error",
  # Allow the standard warning that some valid Python syntax triggers on
  # older Python versions; we only run on 3.12+.
  "ignore::DeprecationWarning:botocore.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/robinhood_lp"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 0  # Phase 0: trivial surface, no minimum yet (raised in T010+)

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# tools/oracle/ holds Foundry/Solidity artifacts; ruff scans
# Python files only and ignores them via standard exclude.
extend-exclude = ["tools"]

[tool.ruff.lint]
# Keep the rule set explicit and narrow during Phase 0. Broaden in later tasks.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_explicit = false  # third-party libs often need Any at first contact
no_implicit_optional = true
check_untyped_defs = true
exclude = ["tools/"]
