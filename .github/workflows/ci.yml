# GitHub Actions — main CI gate.
#
# Every action is pinned to a full commit SHA (see ADR-007). Floating tags
# are forbidden; bumping any pinned reference here requires an explicit
# review of the upstream release notes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  CONDA_ENV_NAME: robinhood-lp

jobs:
  quality:
    name: Quality gate (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: ${{ env.CONDA_ENV_NAME }}

      - name: Provision environment from environment.yml
        shell: bash -l {0}
        run: |
          conda env create -n "$CONDA_ENV_NAME" -f environment.yml
          conda run -n "$CONDA_ENV_NAME" pip install -e ".[dev]"

      - name: Pytest
        shell: bash -l {0}
        run: conda run -n "$CONDA_ENV_NAME" pytest

      # T005: deterministic offline citation checker. Wired here so every
      # PR runs the same five resolvers that ``tests/test_documentation_citations.py``
      # exercises. The step is strictly additive: it never skips, never
      # xfails, and does not weaken any existing check.
      - name: Document citation check (T005)
        shell: bash -l {0}
        run: |
          conda run -n "$CONDA_ENV_NAME" \
            python -m tools.check_citations check \
              --suppressions docs/implement/ci/suppressions.toml \
              --config todo/config.yaml

      # T006: deterministic offline import-graph checker. Enforces
      # ADR-006's dependency direction against every
      # ``robinhood_lp.*`` module under ``src/robinhood_lp/``,
      # parses §2.2 of ARCHITECTURE.md to confirm the layer map and
      # the binding document agree, and fails on import cycles,
      # unseeded-clock imports inside the deterministic tiers, and
      # unclassified modules. The step is strictly additive: it
      # never skips, never xfails, and does not weaken any
      # existing check.
      - name: Import-graph dependency check (T006)
        shell: bash -l {0}
        run: |
          conda run -n "$CONDA_ENV_NAME" \
            python -m tools.check_imports check \
              --suppressions docs/implement/ci/suppressions.toml \
              --config todo/config.yaml \
              --architecture docs/spec/architecture/ARCHITECTURE.md

      - name: Ruff check
        shell: bash -l {0}
        run: conda run -n "$CONDA_ENV_NAME" ruff check .

      - name: Ruff format check
        shell: bash -l {0}
        run: conda run -n "$CONDA_ENV_NAME" ruff format --check .

      - name: Mypy
        shell: bash -l {0}
        run: conda run -n "$CONDA_ENV_NAME" mypy src tests

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ci-${{ github.run_id }}
          path: |
            .pytest_cache
            .ruff_cache
            .mypy_cache
          # Artifact retention: explicit secret / RPC / credential exclusions.
          # The upload path is the cache directory only; the ignore list below
          # is the contract that drops *.env, *.key, *.pem, *.keystore, secrets/,
          # and RPC response caches even if a future workflow adds them.
          retention-days: 14
          if-no-files-found: ignore

  lockfile-integrity:
    name: Python dependency lock integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.3.0
        with:
          python-version: "3.12"

      # Verifies that every entry in requirements.lock.txt has a
      # --hash=sha256:... attribute and that pip can resolve all of them
      # against the PyPI index without modifying the environment
      # (--dry-run). A missing hash, an inconsistent hash, or an
      # unresolvable package fails this job. We never run
      # `pip install --upgrade`, `pip-compile --upgrade`, or any other
      # silent auto-bump in CI; the lockfile is regenerated only by an
      # explicit developer command.
      - name: Verify requirements.lock.txt hashes and resolution
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --dry-run --no-deps -r requirements.lock.txt

      - name: Sanity-check the lockfile shape
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("requirements.lock.txt").read_text(encoding="utf-8")
          hex_re = re.compile(r"^[0-9a-f]{64}$")
          missing_hash = []
          for raw in text.splitlines():
              line = raw.rstrip()
              if not line or line.lstrip().startswith("#"):
                  continue
              if line.endswith("\\"):
                  line = line[:-1].rstrip()
              stripped = line.lstrip()
              if stripped.startswith("--hash=sha256:"):
                  digest = stripped.removeprefix("--hash=sha256:").strip()
                  if not hex_re.match(digest):
                      missing_hash.append(digest)
          assert not missing_hash, f"invalid SHA-256 digests: {missing_hash}"
          # Require that every package header is followed by at least one
          # --hash line. Heuristic: at least one --hash per file.
          assert "--hash=sha256:" in text, "no --hash=sha256 entries in requirements.lock.txt"
          print("lockfile shape OK")
          PY

  network-tests:
    # Network-tagged tests must run unconditionally, separately from the
    # normal quality gate. A network test that reaches a live
    # Robinhood Chain RPC must use a recorded fixture under
    # tests/fixtures/ or tests/ci_fixtures/; silent `pytest.skip` is
    # forbidden by the task contract (see docs/implement/ci/suppressions.toml
    # and todo/evidence/P00/T003/suppressions.md).
    name: Network-tagged tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: ${{ env.CONDA_ENV_NAME }}

      - name: Provision environment
        shell: bash -l {0}
        run: |
          conda env create -n "$CONDA_ENV_NAME" -f environment.yml
          conda run -n "$CONDA_ENV_NAME" pip install -e ".[dev]"

      - name: Run network-tagged tests
        shell: bash -l {0}
        # The `network` marker is registered through --override-ini so
        # the gate does not silently drop the selection. Tests marked
        # @pytest.mark.network must use a recorded fixture under
        # tests/ci_fixtures/network/; CI never talks to a live RPC.
        # If no tests are tagged (current Phase 0 state), collection
        # returns zero nodes and the gate exits zero — but the job is
        # still present in the matrix so the operator sees it.
        run: |
          conda run -n "$CONDA_ENV_NAME" pytest \
            --override-ini="markers=network(requires live RPC or recorded fixture)" \
            -m network --co -q
          conda run -n "$CONDA_ENV_NAME" pytest \
            --override-ini="markers=network(requires live RPC or recorded fixture)" \
            -m network -v
