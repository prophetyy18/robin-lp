# V1 valid fixture: single Robinhood Chain, single active PoolKey,
# single user-approved target token.
#
# None of these addresses are real deployments; they are 20-byte hex
# literals used only to exercise the parser. Real deployment addresses
# are introduced by T024 after on-chain verification.
#
# Robinhood Chain mainnet chain ID is recorded here as a placeholder;
# T024 will replace it with the verified value and pin the bytecode hash.

[[chains]]
chain_id = 46630
rpc_url_env = "ROBINHOOD_CHAIN_RPC_URL"
confirmations = 12
start_block = 1
pool_manager_address = "0x0000000000000000000000000000000000000001"
state_view_address = "0x0000000000000000000000000000000000000002"
request_timeout_seconds = 30
max_block_range_per_request = 10_000

[target_token]
chain_id = 46630
contract_address = "0x0000000000000000000000000000000000000100"
symbol = "TARGET"
decimals = 18
user_approved = true
approval_notes = "user-entered placeholder for T002 acceptance"

[[pools]]
chain_id = 46630
support_level = "paper"

[pools.pool_key]
currency0 = "0x0000000000000000000000000000000000000100"  # target token
currency1 = "0x0000000000000000000000000000000000000200"  # paired token
fee = 3000
tick_spacing = 60
hooks = "0x0000000000000000000000000000000000000000"
